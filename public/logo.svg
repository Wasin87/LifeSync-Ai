<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Accent gradient matching LifeSync AI's modern violet theme -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F0B26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid background block for standard maskable execution -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer sleek concentric guiding circle -->
  <circle cx="256" cy="256" r="180" stroke="#4F46E5" stroke-width="4" stroke-opacity="0.3" fill="none" />
  <circle cx="256" cy="256" r="210" stroke="#8B5CF6" stroke-width="2" stroke-opacity="0.15" fill="none" />

  <!-- Outer framing protective squircle arc anchors -->
  <path d="M 160 120 A 180 180 0 0 0 160 392" stroke="#C4C9FF" stroke-width="28" stroke-linecap="round" fill="none" />
  <path d="M 352 120 A 180 180 0 0 1 352 392" stroke="#C4C9FF" stroke-width="28" stroke-linecap="round" fill="none" />

  <!-- Continuous High-Contrast Heart Rate ECG Waveform -->
  <path d="M 110 256 L 190 256 L 225 150 L 287 362 L 322 256 L 402 256" 
        stroke="url(#purpleGrad)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#glow)" />

  <!-- ECG Signal calibration indicator dots -->
  <circle cx="225" cy="150" r="16" fill="#FFFFFF" />
  <circle cx="287" cy="362" r="16" fill="#FFFFFF" />
</svg>
