<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulse-grad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="100" x2="100" y2="0">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  {/* Modern Hexagonal Frame */}
  <path 
    d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z" 
    stroke="url(#ring-grad)" 
    stroke-width="4" 
    stroke-linejoin="round"
    stroke-opacity="0.3"
  />

  {/* Central Pulse Core */}
  <path 
    d="M 25 50 H 40 L 48 25 L 56 75 L 64 42 L 70 50 H 75" 
    stroke="url(#pulse-grad)" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />

  {/* Neural Nodes */}
  <circle cx="48" cy="25" r="4" fill="white" />
  <circle cx="56" cy="75" r="4" fill="white" />
  
  {/* Inner Glow */}
  <circle cx="50" cy="50" r="35" stroke="white" stroke-width="0.5" stroke-dasharray="2 10" stroke-opacity="0.2" />
</svg>
